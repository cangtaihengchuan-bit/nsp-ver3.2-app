<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Kaimono Clock 店舗側モード</title>
    <style>
      :root {
        --ink: #12201f;
        --muted: #5f6f6b;
        --line: #dce6e4;
        --mint: #1f8f8b;
        --mint-dark: #142c2c;
        --paper: #fffdf7;
        --shadow: 0 18px 36px rgba(18, 32, 31, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--ink);
        font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
        background:
          radial-gradient(circle at 86% 8%, rgba(114, 183, 242, 0.2), transparent 23rem),
          linear-gradient(180deg, #fff8df 0%, #f3fbf8 58%, #fffdf7 100%);
      }

      main {
        width: min(760px, calc(100% - 28px));
        display: grid;
        gap: 16px;
        padding: 18px;
        border: 1px solid rgba(220, 230, 228, 0.95);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
      }

      .logo {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 8px;
        color: #fff;
        background: linear-gradient(140deg, var(--mint), #72b7f2);
      }

      h1, p { margin: 0; }

      h1 {
        font-size: clamp(1.8rem, 6vw, 3.2rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        color: var(--muted);
        font-weight: 800;
        line-height: 1.8;
      }

      .mode-panel {
        display: grid;
        gap: 8px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      a {
        min-height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: #fff;
        font-weight: 900;
        text-decoration: none;
        text-align: center;
      }

      a.primary {
        color: #fff;
        background: var(--mint-dark);
      }

      @media (max-width: 640px) {
        body { place-items: stretch; }
        main {
          width: auto;
          min-height: 100vh;
          margin: 0;
          border-width: 0;
          border-radius: 0;
        }
        .actions { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main aria-label="店舗側モード">
      <div class="brand">
        <span class="logo">S</span>
        <strong>Kaimono Clock ver3.2</strong>
      </div>
      <section class="mode-panel">
        <h1>店舗側モード</h1>
        <p>店舗から広告・割引情報を出すための入口です。具体的な登録機能は、今後のフィードバックに合わせて追加します。</p>
      </section>
      <nav class="actions" aria-label="ページ移動">
        <a class="primary" href="./index.html">体験トップ</a>
        <a href="./shopping.html">買い物メモ</a>
        <a href="./app.html">割引メモ</a>
        <a href="./household.html">家計簿</a>
      </nav>
    </main>
  </body>
</html>
